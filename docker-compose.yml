# PostgreSQL para desenvolvimento local. Em produção use um banco gerenciado.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gta
      POSTGRES_PASSWORD: troque_esta_senha
      POSTGRES_DB: gta_store
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gta -d gta_store"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
